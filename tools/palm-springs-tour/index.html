<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Palm Springs tour</title>
<style>
@font-face { font-family: Cormorant; font-weight: 500; src: url(node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 400; src: url(node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2) format('woff2'); }
@font-face { font-family: Inter; font-weight: 600; src: url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2) format('woff2'); }
html, body { margin: 0; background: #000; overflow: hidden; }
canvas { position: absolute; left: 0; top: 0; display: block; }
#ui { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; color: #fff; font-family: Inter, sans-serif; pointer-events: none; }
#shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.42) 0, rgba(0,0,0,0) 17%, rgba(0,0,0,0) 62%, rgba(0,0,0,.5) 100%); }
#title { position: absolute; top: 150px; width: 100%; text-align: center; font-family: Cormorant, serif; font-weight: 500; font-size: 76px; letter-spacing: 16px; text-indent: 16px; text-shadow: 0 2px 24px rgba(0,0,0,.45); }
#sub { position: absolute; top: 250px; width: 100%; text-align: center; font-size: 23px; letter-spacing: 7px; text-indent: 7px; opacity: .88; text-transform: uppercase; }
#cap { position: absolute; top: 1270px; left: 90px; right: 90px; text-align: center; font-family: Cormorant, serif; font-size: 50px; line-height: 1.15; text-shadow: 0 2px 22px rgba(0,0,0,.6); }
#tod { position: absolute; top: 1500px; left: 110px; width: 860px; height: 150px; }
#track { position: absolute; top: 74px; left: 0; width: 100%; height: 6px; border-radius: 3px; opacity: .95;
  background: linear-gradient(90deg, #ffb48a 0%, #ffe9b8 14%, #cfeaff 38%, #ffe2a6 62%, #ff9a5a 78%, #7a5ea8 88%, #26335f 100%); box-shadow: 0 0 14px rgba(0,0,0,.35); }
#knob { position: absolute; top: 49px; width: 56px; height: 56px; margin-left: -28px; border-radius: 50%; box-shadow: 0 0 26px 6px rgba(255,220,150,.55); }
#moon { position: absolute; top: 49px; width: 56px; height: 56px; margin-left: -28px; border-radius: 50%; overflow: hidden; }
#moon i { position: absolute; left: 16px; top: -8px; width: 56px; height: 56px; border-radius: 50%; background: #2a3564; }
#clock { position: absolute; top: -8px; width: 240px; margin-left: -120px; text-align: center; font-weight: 600; font-size: 34px; letter-spacing: 1px; text-shadow: 0 1px 14px rgba(0,0,0,.6); }
.tick { position: absolute; top: 104px; width: 200px; margin-left: -100px; text-align: center; font-size: 19px; letter-spacing: 4px; opacity: .7; }
.tick.on { opacity: 1; font-weight: 600; }
#foot { position: absolute; top: 1690px; width: 100%; text-align: center; font-size: 17px; letter-spacing: 1.5px; opacity: .62; }
</style>
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="shade"></div>
  <div id="title">PALM SPRINGS</div>
  <div id="sub">A day in the community</div>
  <div id="cap"></div>
  <div id="tod">
    <div id="clock"></div>
    <div id="track"></div>
    <div id="knob"></div>
    <div id="moon"><i></i></div>
    <div class="tick" style="left:8%">MORNING</div>
    <div class="tick" style="left:38%">AFTERNOON</div>
    <div class="tick" style="left:68%">SUNSET</div>
    <div class="tick" style="left:93%">NIGHT</div>
  </div>
  <div id="foot">Artist's impression built from the developer's scale model · not an official render</div>
</div>
<script type="module" src="scene.js"></script>
</body>
</html>
