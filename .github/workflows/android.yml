name: Build Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Bundle an offline copy of the app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r docs/* android/app/src/main/assets/www/

      - name: Use the private signing key if one is set
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > android/app/release.jks; fi

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
          KS_ALIAS: ${{ secrets.KS_ALIAS }}
        run: |
          gradle -p android assembleRelease \
            -PappUrl="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            -PversionCode=${{ github.run_number }}
          cp android/app/build/outputs/apk/release/app-release.apk AWaz-Realty.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AWaz Realty 1.0.${{ github.run_number }}
          make_latest: true
          files: AWaz-Realty.apk
          body: |
            Install on Android: open this page on your phone, tap **AWaz-Realty.apk**, then Install.
            Content and data update by themselves every morning; you only need a new APK when this page shows a newer version.
