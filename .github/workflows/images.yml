name: Fetch project images

# Downloads project cover images listed in tools/images.json, resizes them
# to 720px wide WebP and commits them to docs/img/ so the website and app can
# serve them from their own origin.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/images.json', 'tools/fetch_images.py', '.github/workflows/images.yml']

permissions:
  contents: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - run: python tools/fetch_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/img
          if git diff --cached --quiet; then echo "No new images"; exit 0; fi
          git commit -m "Project images $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
