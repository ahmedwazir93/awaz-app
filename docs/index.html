<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Ahmed Wazir</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0C">
<meta name="description" content="Ahmed Wazir's UAE property app: off-plan launches, calculators, buyer guides and market data.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<script>
/* Theme before first paint: light by day (6:00-18:00 Dubai), dark at night, unless picked by hand */
(function () {
  var m = "auto"; try { m = localStorage.getItem("aw-theme") || "auto"; } catch (e) {}
  var h = +new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Dubai", hour: "numeric", hourCycle: "h23" }).format(new Date());
  document.documentElement.setAttribute("data-theme", m === "light" || m === "dark" ? m : (h >= 6 && h < 18 ? "light" : "dark"));
})();
</script>
<style>
/* App system: tokens per theme, rounded tiles and sheets, one red accent for actions and live numbers. */
:root {
  --ink: #0B0B0C; --ink-2: #151517; --ink-3: #1E1E21; --ink-4: #26262A; --line: #2B2A2E;
  --bone: #F4F1EE; --mute: #A6A2A8; --red: #D7192A; --red-text: #FF4252; --red-soft: rgba(215,25,42,.16);
  --ok: #3FBF7F; --ok-soft: rgba(63,191,127,.14); --warn: #E8B44A; --warn-soft: rgba(232,180,74,.14);
  --shadow: 0 8px 30px rgba(0,0,0,.45); --logo-filter: none; --scrim: rgba(0,0,0,.55);
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --r: 16px; --r-sm: 12px; --nav-h: 66px; --top-h: 58px;
  --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --ink: #F4F1EE; --ink-2: #FFFFFF; --ink-3: #EDE9E4; --ink-4: #E2DDD7; --line: #DAD4CD;
  --bone: #121214; --mute: #5C5860; --red: #D7192A; --red-text: #B8101F; --red-soft: rgba(215,25,42,.10);
  --ok: #1B7A4B; --ok-soft: rgba(27,122,75,.10); --warn: #8F6200; --warn-soft: rgba(143,98,0,.10);
  --shadow: 0 6px 24px rgba(30,20,10,.12); --logo-filter: brightness(0) opacity(.82); --scrim: rgba(20,16,12,.35);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--ink); color: var(--bone); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; -webkit-user-select: none; user-select: none; }
input, textarea, .sel { -webkit-user-select: text; user-select: text; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--red-text); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; }
p { margin: 0; }
.dh { width: .78em; height: .72em; vertical-align: -.02em; margin-right: .06em; }
.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--mono); }
.muted { color: var(--mute); }
.disp { font-family: var(--display); text-transform: uppercase; letter-spacing: .005em; line-height: .95; }
.lg { color: var(--bone); }
.lg-png { filter: var(--logo-filter); }

/* ---------- frame ---------- */
.topbar { position: fixed; inset: 0 0 auto; z-index: 30; height: calc(var(--top-h) + var(--st)); padding: var(--st) 12px 0 16px; display: flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--ink) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.topbar.lined { box-shadow: 0 1px 0 var(--line); }
.wm { display: flex; align-items: center; height: 40px; margin-right: auto; }
.wm svg { height: 19px; width: auto; display: block; color: var(--bone); }
.tb-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--bone); }
.tb-btn:active { background: var(--ink-3); }
.chip-sel { appearance: none; -webkit-appearance: none; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--ink-3); border: 0; font: 700 12px var(--mono); letter-spacing: .04em; color: var(--bone); }
.mode { height: 34px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--ink-3); display: inline-flex; align-items: center; gap: 7px; font: 700 12px var(--body); }
.mode i { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); }
.mode.on { background: var(--red); color: #fff; }
.mode.on i { background: #fff; }

main { padding: calc(var(--top-h) + var(--st)) 0 calc(var(--nav-h) + var(--sb) + 28px); }
.scr { max-width: 760px; margin: 0 auto; padding: 4px 16px 0; animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.tabs { position: fixed; inset: auto 0 0; z-index: 30; height: calc(var(--nav-h) + var(--sb)); padding: 0 6px var(--sb); display: grid; grid-template-columns: repeat(4, 1fr); background: color-mix(in srgb, var(--ink-2) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 -1px 0 var(--line); }
.tabs button { display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--mute); font: 600 11px var(--body); position: relative; }
.tabs .pill { width: 56px; height: 30px; border-radius: 999px; display: grid; place-items: center; transition: background .2s; }
.tabs button[aria-current="page"] { color: var(--bone); }
.tabs button[aria-current="page"] .pill { background: var(--red-soft); color: var(--red-text); }
.badge { position: absolute; top: 6px; left: calc(50% + 10px); min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px; background: var(--red); color: #fff; font: 700 10px/17px var(--mono); text-align: center; }

/* ---------- headings ---------- */
.h-big { font: 900 40px/0.95 var(--display); text-transform: uppercase; }
.h-big em { font-style: normal; color: var(--red-text); }
.sec { margin-top: 26px; }
.sec-t { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.sec-t h2 { font: 800 15px var(--body); letter-spacing: .01em; }
.sec-t .more { font: 700 13px var(--body); color: var(--red-text); display: inline-flex; align-items: center; gap: 2px; }
.eyebrow { font: 600 11px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); }
.sub { color: var(--mute); font-size: 14px; }
.page-h { padding: 12px 0 16px; display: grid; gap: 6px; }
.note { color: var(--mute); font-size: 12px; margin-top: 10px; line-height: 1.5; }

/* ---------- profile card ---------- */
.prof { margin-top: 8px; border-radius: 22px; padding: 18px; background: linear-gradient(135deg, var(--ink-2), var(--ink-3)); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.prof::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, var(--red-soft), transparent 70%); pointer-events: none; }
.prof-top { display: flex; gap: 14px; align-items: center; }
.avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 3px var(--ink-2), 0 0 0 5px var(--red); background: var(--ink-4); }
.prof-n { font: 900 26px/1 var(--display); text-transform: uppercase; }
.prof-r { color: var(--mute); font-size: 13px; margin-top: 4px; }
.verified { display: inline-flex; align-items: center; gap: 5px; margin-top: 7px; font: 600 11px var(--mono); letter-spacing: .04em; color: var(--ok); background: var(--ok-soft); padding: 4px 8px; border-radius: 999px; }
.verified svg { width: 13px; height: 13px; }
.acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
.act { display: grid; justify-items: center; gap: 6px; font: 600 12px var(--body); color: var(--bone); }
.act span.c { width: 52px; height: 52px; border-radius: 18px; display: grid; place-items: center; background: var(--ink-4); }
.act.pri span.c { background: var(--red); color: #fff; }
.act:active span.c { transform: scale(.94); }

.search { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 16px; border-radius: 999px; background: var(--ink-3); color: var(--mute); font-size: 14.5px; width: 100%; text-align: left; margin-top: 16px; }
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-size: 16px; color: var(--bone); }

/* ---------- launcher grid ---------- */
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 6px; }
.app { display: grid; justify-items: center; gap: 7px; text-align: center; font: 600 11.5px/1.2 var(--body); color: var(--bone); position: relative; }
.app .ib { width: 58px; height: 58px; border-radius: 19px; display: grid; place-items: center; background: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); color: var(--red-text); transition: transform .12s; }
.app .ib .ic { width: 26px; height: 26px; }
.app:active .ib { transform: scale(.92); }
.app .tag { position: absolute; top: -4px; right: calc(50% - 36px); background: var(--red); color: #fff; font: 700 9px/1 var(--mono); padding: 3px 5px; border-radius: 999px; }
.app.hot .ib { background: var(--red); color: #fff; box-shadow: none; }

.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--ink-2); border-radius: var(--r); padding: 16px; text-align: left; display: grid; gap: 6px; align-content: start; min-height: 116px; box-shadow: inset 0 0 0 1px var(--line); position: relative; }
.tile:active { transform: scale(.98); }
.tile .ib { width: 40px; height: 40px; border-radius: 13px; background: var(--red-soft); color: var(--red-text); display: grid; place-items: center; margin-bottom: 4px; }
.tile b { font: 800 15px/1.2 var(--body); }
.tile small { color: var(--mute); font-size: 12.5px; line-height: 1.35; }
.tile .tag { position: absolute; top: 14px; right: 14px; font: 700 10px/1 var(--mono); padding: 4px 7px; border-radius: 999px; background: var(--red); color: #fff; }
.grp-t { font: 600 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--mute); margin: 22px 2px 10px; }

/* ---------- lists ---------- */
.list { background: var(--ink-2); border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.li { display: flex; align-items: center; gap: 14px; padding: 14px 16px; width: 100%; text-align: left; position: relative; }
.li + .li::before { content: ""; position: absolute; top: 0; left: 70px; right: 0; height: 1px; background: var(--line); }
.li:active { background: var(--ink-3); }
.li .ib { width: 40px; height: 40px; border-radius: 12px; background: var(--ink-3); color: var(--red-text); display: grid; place-items: center; flex: none; font-size: 21px; }
.li .t { flex: 1; min-width: 0; }
.li .t b { display: block; font-weight: 700; font-size: 15px; }
.li .t small { display: block; color: var(--mute); font-size: 12.5px; margin-top: 1px; }
.li .chev { color: var(--mute); }
.li.hot .t b::before { content: "HOT"; font: 700 9.5px/1 var(--mono); background: var(--red); color: #fff; padding: 3px 5px; border-radius: 4px; margin-right: 7px; vertical-align: 2px; }

/* ---------- carousels ---------- */
.rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; flex: none; }
.mop { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; margin-top: 8px; font: 600 11px/1 var(--mono); letter-spacing: .04em; color: var(--mute); }
.mop .ok { color: var(--ok); display: inline-flex; align-items: center; gap: 4px; }
.mop .ok svg { width: 12px; height: 12px; }
.mop .bar { height: 5px; background: var(--ink-3, var(--ink-4)); border-radius: 3px; overflow: hidden; }
.mop .bar i { display: block; height: 100%; background: var(--ok); min-width: 2px; }
.pc { width: 260px; border-radius: var(--r); overflow: hidden; background: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); text-align: left; display: block; }
.pc .im { height: 150px; background: var(--ink-4) center/cover no-repeat; position: relative; }
.pc .im .st { position: absolute; left: 10px; top: 10px; font: 700 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 6px 8px; border-radius: 999px; background: rgba(11,11,12,.72); color: #fff; backdrop-filter: blur(6px); }
.pc .im .st.r { background: var(--red); }
.pc .im .noimg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); }
.pc .bd { padding: 12px 14px 14px; display: grid; gap: 3px; }
.pc .bd b { font: 800 16px/1.2 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc .bd small { color: var(--mute); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc .bd .pr { font: 800 15px var(--body); margin-top: 4px; color: var(--red-text); }
.stat { width: 168px; border-radius: var(--r); background: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); padding: 14px; display: grid; gap: 4px; }
.stat span { font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.stat b { font: 900 30px/1 var(--display); }
.stat small { color: var(--mute); font-size: 12px; }
.up { color: var(--ok); } .down { color: var(--red-text); }
.bar3 { display: flex; height: 5px; gap: 2px; border-radius: 3px; overflow: hidden; margin-top: 6px; }

/* ---------- project list ---------- */
.seg { display: flex; padding: 4px; border-radius: 999px; background: var(--ink-3); gap: 4px; }
.seg button { flex: 1; height: 38px; border-radius: 999px; font: 700 13px var(--body); color: var(--mute); white-space: nowrap; padding: 0 10px; }
.seg button[aria-pressed="true"] { background: var(--ink-2); color: var(--bone); box-shadow: var(--shadow); }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 12px -16px 0; padding: 0 16px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--ink-3); font: 600 13px var(--body); color: var(--bone); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--bone); color: var(--ink); }
.chip .ic { width: 16px; height: 16px; }
.pl { display: grid; gap: 12px; margin-top: 14px; }
.pr-card { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 10px; border-radius: var(--r); background: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); text-align: left; width: 100%; }
.pr-card:active { background: var(--ink-3); }
.pr-card .im { border-radius: 12px; background: var(--ink-4) center/cover no-repeat; min-height: 104px; position: relative; display: grid; place-items: center; overflow: hidden; }
.pr-card .im .lgbox { color: var(--bone); opacity: .85; padding: 8px; }
.pr-card .bd { min-width: 0; display: grid; gap: 3px; align-content: start; padding: 2px 4px 2px 0; }
.pr-card .k { display: flex; gap: 6px; align-items: center; font: 600 10.5px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.pr-card .k .s { color: var(--red-text); }
.pr-card b { font: 800 16px/1.2 var(--body); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pr-card small { color: var(--mute); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pr-card .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; font-size: 12.5px; }
.pr-card .meta .pr { font-weight: 800; color: var(--bone); }
.pick-flag { position: absolute; left: 6px; top: 6px; background: var(--red); color: #fff; font: 700 9px/1 var(--mono); letter-spacing: .05em; padding: 4px 6px; border-radius: 999px; }
.empty { text-align: center; color: var(--mute); padding: 40px 16px; border: 1px dashed var(--line); border-radius: var(--r); }
.count { font: 600 12px var(--mono); color: var(--mute); margin-top: 14px; }
.fab { position: fixed; right: 16px; bottom: calc(var(--nav-h) + var(--sb) + 16px); z-index: 25; height: 50px; padding: 0 20px 0 16px; border-radius: 999px; background: var(--bone); color: var(--ink); font: 800 14px var(--body); display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--shadow); }

/* ---------- screens (pushed views) ---------- */
.view { position: fixed; inset: 0; z-index: 50; background: var(--ink); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
.view.open { transform: none; visibility: visible; }
.vbar { flex: none; height: calc(54px + var(--st)); padding: var(--st) 6px 0; display: flex; align-items: center; gap: 2px; background: var(--ink); box-shadow: 0 1px 0 var(--line); position: relative; z-index: 2; }
.vbar h2 { flex: 1; font: 800 17px var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; }
.vbody { flex: 1; overflow-y: auto; position: relative; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.vbody iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--ink); }
.vin { padding: 16px 16px calc(110px + var(--sb)); max-width: 760px; margin: 0 auto; }
.vin.flush { padding-top: 0; }
.vfoot { flex: none; z-index: 3; padding: 10px 16px calc(10px + var(--sb)); display: flex; gap: 8px; background: var(--ink); box-shadow: 0 -1px 0 var(--line); }
.vin.hasfoot { padding-bottom: 28px; }
.vfoot .btn { white-space: nowrap; font-size: 14px; padding: 0 12px; }
.vfoot .btn-red { flex: 1.7; }
.vfoot .btn { flex: 1; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ink); z-index: 1; }
.bars { display: flex; gap: 4px; align-items: flex-end; height: 28px; }
.bars i { width: 5px; border-radius: 3px; background: var(--red); animation: eq .9s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay: .15s } .bars i:nth-child(3) { animation-delay: .3s } .bars i:nth-child(4) { animation-delay: .45s }
@keyframes eq { 0%,100% { height: 25% } 50% { height: 100% } }
@media (prefers-reduced-motion: reduce) { .view, .sheet .panel { transition: none } .bars i { animation: none; height: 60% } .scr { animation: none } }

/* ---------- bottom sheet ---------- */
.sheet { position: fixed; inset: 0; z-index: 70; display: flex; align-items: flex-end; background: var(--scrim); opacity: 0; visibility: hidden; transition: opacity .2s; }
.sheet.open { opacity: 1; visibility: visible; }
.sheet .panel { width: 100%; max-height: 86vh; overflow-y: auto; background: var(--ink-2); border-radius: 24px 24px 0 0; padding: 10px 16px calc(20px + var(--sb)); transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); }
.sheet.open .panel { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet h3 { font: 800 18px var(--body); margin-bottom: 4px; }
.fl-t { font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); margin: 18px 0 8px; }
.wrapchips { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 50px; padding: 0 18px; border-radius: 14px; font: 800 14.5px var(--body); background: var(--ink-3); color: var(--bone); }
.btn:active { transform: scale(.98); }
.btn-red { background: var(--red); color: #fff; }
.btn-light { background: var(--bone); color: var(--ink); }
.btn-sm { height: 40px; padding: 0 14px; border-radius: 12px; font-size: 13px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 auto; }
.btn .ic { width: 19px; height: 19px; }

/* ---------- project detail ---------- */
.hero-im { height: 260px; margin: 0 -16px; background: var(--ink-4) center/cover no-repeat; position: relative; display: grid; place-items: center; }
.hero-im::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--ink), transparent 55%); }
.hero-im .lgbox { color: var(--bone); transform: scale(1.6); }
.pd-k { display: flex; gap: 6px; flex-wrap: wrap; margin-top: -26px; position: relative; z-index: 1; }
.pill { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 999px; font: 700 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; background: var(--ink-3); color: var(--bone); }
.pill.r { background: var(--red); color: #fff; }
.pill.g { background: var(--ok-soft); color: var(--ok); }
.pd-n { font: 900 38px/.95 var(--display); text-transform: uppercase; margin-top: 12px; }
.pd-l { color: var(--mute); margin-top: 6px; }
.op { margin-top: 12px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); display: grid; gap: 10px; }

function roeModel(o, useLoan) {
  const { price, tf, down, rate, term, agency, rent, rg, sc, mm, vac, app, years, sell } = o;
  const loan = useLoan ? price * (1 - down / 100) : 0, pay = loan ? emi(loan, rate, term) : 0;
  const fees = price * tf.rate + (tf.dubai ? 580 + (price >= 500000 ? 4200 : 2100) : 0) + (loan ? (tf.abu ? Math.min(loan * 0.001, 1e6) : loan * 0.0025 + (tf.dubai ? 290 : 0)) + 3150 + loan * 0.0105 : 0);
  const eq0 = price - loan + fees; let bal = loan, cum = 0; const rows = [], cfs = [-eq0], r = rate / 1200;
  for (let y = 1; y <= years; y++) {
    let interest = 0, principal = 0;
    for (let m = 0; m < 12; m++) { if (bal <= 0 || (y - 1) * 12 + m >= term * 12) break; const i = bal * r, p = Math.min(bal, pay - i); interest += i; principal += p; bal -= p; }
    const g = rent * Math.pow(1 + rg / 100, y - 1), income = g * (1 - vac / 52), costs = sc + g * mm / 100, cf = income - costs - interest - principal; cum += cf;
    const value = price * Math.pow(1 + app / 100, y);
    rows.push({ y, cf, cum, principal, value, bal, appY: value - price * Math.pow(1 + app / 100, y - 1) }); cfs.push(cf);
  }
  const last = rows[rows.length - 1], proceeds = last.value * (1 - sell / 100) - last.bal; cfs[cfs.length - 1] += proceeds;
  const irr = (() => { let lo = -0.99, hi = 1.5; const npv = x => cfs.reduce((a, c, i) => a + c / Math.pow(1 + x, i), 0); if (npv(lo) * npv(hi) > 0) return NaN; for (let k = 0; k < 120; k++) { const m = (lo + hi) / 2; (npv(lo) * npv(m) <= 0) ? hi = m : lo = m; } return (lo + hi) / 2; })();
  const y1 = rows[0];
  return { loan, fees, eq0, rows, profit: proceeds + cum - eq0, multiple: (proceeds + cum) / eq0, irr, coc: y1.cf / eq0, roe1: (y1.cf + y1.principal + y1.appY) / eq0, y1 };
}

function holidayRail() {

  const td = ymdz(now), day = s => new Date(s + "T12:00:00+04:00");
  const greg = new Intl.DateTimeFormat("en-GB", { timeZone: tz, weekday: "short", day: "numeric", month: "short" }).format(now);
  const HM = ["Muharram", "Safar", "Rabi' al-Awwal", "Rabi' al-Thani", "Jumada al-Ula", "Jumada al-Akhirah", "Rajab", "Sha'ban", "Ramadan", "Shawwal", "Dhu al-Qadah", "Dhu al-Hijjah"];

}

const PF = Object.assign({ src: "w", em: "all", q: "", type: "all", beds: "all", max: 0, ho: 0, only: "all", dev: "all", sort: "rec", n: 30 }, S.get("aw-pf", {}), { q: "", n: 30 });
function filtered() {
  const base = PF.src === "w" ? WP : ALLP, q = PF.q.trim().toLowerCase();
  let L = base.filter(p => (PF.em === "all" || p.em === PF.em) && (PF.type === "all" || p.type === PF.type)
    && (!q || (p.n + " " + p.d + " " + (p.a || "") + " " + p.em).toLowerCase().includes(q))
    && (PF.dev === "all" || p.d === PF.dev)
    && (!PF.max || (p.from && p.from <= PF.max))
    && (!PF.ho || (p.h && +p.h.slice(0, 4) <= PF.ho))
    && (PF.beds === "all" || (p.beds && p.beds[0] != null && (PF.beds === "4" ? p.beds[1] >= 4 : p.beds[0] <= +PF.beds && p.beds[1] >= +PF.beds)))
    && (PF.only === "all" || (PF.only === "new" ? p.fresh : PF.only === "partner" ? (p.src === "w" || p.partner) : PF.only === "pick" ? p.pick : true)));
  const pr = p => p.from || 9e15;
  if (PF.sort === "lo") L.sort((a, b) => pr(a) - pr(b)); else if (PF.sort === "hi") L.sort((a, b) => (b.from || 0) - (a.from || 0));
  else if (PF.sort === "ho") L.sort((a, b) => (a.h || "9999") < (b.h || "9999") ? -1 : 1);
  else L.sort((a, b) => (!!b.pick - !!a.pick) || (b.src === "w") - (a.src === "w") || (!!b.fresh - !!a.fresh) || (!!b.img - !!a.img));
  return L;
}

let MAPV = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  return new Promise((ok, no) => {
    const c = document.createElement("link"); c.rel = "stylesheet"; c.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(c);
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s);

function openMap(focus) {
  let src = focus ? "all" : (PF.src || "w");
  pushView({
    t: "Launch map", flush: 1,
    html: () => `<div id="map"></div><div class="map-tools"><button class="chip" data-ms="w" aria-pressed="${src === "w"}">Ahmed's launches</button><button class="chip" data-ms="all" aria-pressed="${src === "all"}">All projects</button></div><div class="map-card" id="mapCard" hidden></div>`,
    init(nb, el) {

        L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19, attribution: "Esri, Maxar, Earthstar Geographics" }).addTo(m);
        L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxZoom: 19 }).addTo(m);
        const layer = L.layerGroup().addTo(m);
        const draw = () => {
          layer.clearLayers();
          const L2 = (src === "w" ? WP : ALLP).filter(p => p.ll && p.ll[0]);
          L2.forEach(p => {
            const mk = L.marker([p.ll[1], p.ll[0]], { icon: L.divIcon({ className: "", html: `<div class="mk-pin${p.src === "w" ? " w" : ""}"></div>`, iconSize: [20, 20], iconAnchor: [10, 10] }) }).addTo(layer);

          c.innerHTML = prCard(p); bindScreen(c); m.panTo([p.ll[1], p.ll[0]]);
        };
        draw();
        nb.querySelectorAll("[data-ms]").forEach(b => b.onclick = () => { src = b.dataset.ms; nb.querySelectorAll("[data-ms]").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); });

        setTimeout(() => m.invalidateSize(), 350);
      }).catch(() => { nb.querySelector("#map").innerHTML = `<p class="empty" style="margin:80px 16px">The map needs an internet connection.</p>`; });
    }
  });
}

    if (k === "⌫") pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 4) pinBuf += k;

      if (pinStage === "enter") { if (hash(pinBuf) === S.get(PIN_KEY)) { pinBuf = ""; pinStage = ""; setBroker(true); toast("Broker mode on"); return; } return fail(); }
      if (pinStage === "new") { pinStage = "confirm"; pinStage_new = pinBuf; pinBuf = ""; return render(); }
      if (pinStage === "confirm") { if (pinBuf === pinStage_new) { S.set(PIN_KEY, hash(pinBuf)); pinBuf = ""; pinStage = ""; setBroker(true); toast("PIN set. Broker mode on."); return; } pinStage = "new"; return fail("Didn't match. Try again."); }
    }
    render();
  });
  function fail(msg) { pinBuf = ""; render(); $("dots").classList.add("shake"); toast(msg || "Wrong PIN"); }
}

      ["#cv-int", "#cv-ext", "#cv-bal", "#cv-scr"].forEach(s => q(s).addEventListener("input", sc)); sc();
      const cs = { usd: "USD", gbp: "GBP", inr: "INR" };
      const fromAed = () => { const a = num(q("#cv-aed").value); for (const [k, c] of Object.entries(cs)) q("#cv-" + k).value = Math.round(a * FX[c]); };

      q("#cv-ft").dispatchEvent(new Event("input")); pr(); fromAed();
    }
  };
}
