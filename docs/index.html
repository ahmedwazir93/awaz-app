<style>
/* One black canvas, one red accent. Cards are flat panels separated by hairlines; the red is kept for actions and live numbers. */
:root {
  --ink: #0B0B0C; --ink-2: #131315; --ink-3: #1B1B1E; --line: #2B2A2E;
  --bone: #F4F1EE; --mute: #A6A2A8; --red: #D7192A; --red-text: #FF4252; --ok: #3FBF7F; --warn: #E8B44A;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --nav-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--ink); color: var(--bone); font: 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red-text); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); text-transform: uppercase; margin: 0; line-height: .95; letter-spacing: .005em; }
p { margin: 0; }
.dh { width: .78em; height: .72em; vertical-align: -.02em; margin-right: .06em; }

/* App frame */
.topbar { position: fixed; inset: 0 0 auto; z-index: 20; height: calc(56px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 16px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: color-mix(in srgb, var(--ink) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.logo svg { width: 70px; height: 27px; display: block; }
.logo span { font: 600 10px/1 var(--mono); letter-spacing: .18em; text-transform: uppercase; color: var(--mute); padding-left: 10px; border-left: 1px solid var(--line); }
.top-r { display: flex; align-items: center; gap: 8px; }
.cur { appearance: none; background: var(--ink-3); border: 1px solid var(--line); padding: 7px 10px; font: 600 12px var(--mono); letter-spacing: .06em; border-radius: 0; }
.mode-chip { font: 600 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 8px 10px; border: 1px solid var(--line); background: transparent; display: inline-flex; gap: 7px; align-items: center; }
.mode-chip i { width: 7px; height: 7px; background: var(--mute); display: inline-block; }
.mode-chip.on { border-color: var(--red); }
.mode-chip.on i { background: var(--red); }

main { padding: calc(56px + env(safe-area-inset-top, 0px)) 0 calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 24px); min-height: 100%; }
.screen { padding: 0 16px; max-width: 720px; margin: 0 auto; }
.screen-head { padding: 22px 0 16px; display: grid; gap: 10px; }
.eyebrow { font: 600 11px/1.2 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.eyebrow i { width: 7px; height: 7px; background: var(--red); display: inline-block; }
.screen-head h1 { font-size: 46px; font-weight: 900; }
.screen-head h1 em { font-style: normal; color: var(--red-text); }
.sub { color: var(--mute); font-size: 14px; }
.sec { margin-top: 26px; }
.sec-t { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.sec-t h2 { font-size: 24px; font-weight: 800; }
.sec-t a, .sec-t button { font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--red-text); text-decoration: none; background: none; border: 0; padding: 0; }

.tabs { position: fixed; inset: auto 0 0; z-index: 20; height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); display: grid; grid-template-columns: repeat(5, 1fr); background: var(--ink-2); border-top: 1px solid var(--line); }
.tabs button { background: none; border: 0; display: grid; justify-items: center; align-content: center; gap: 4px; color: var(--mute); font: 600 11px var(--body); position: relative; }
.tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: square; }
.tabs button[aria-current="page"] { color: var(--bone); }
.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 2px; background: var(--red); }
.badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; background: var(--red); color: #fff; font: 700 10px/16px var(--mono); text-align: center; }

/* Building blocks */
.panel { background: var(--ink-2); border: 1px solid var(--line); padding: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--ink-2); border: 1px solid var(--line); padding: 14px; text-align: left; display: grid; gap: 6px; align-content: start; min-height: 104px; text-decoration: none; position: relative; }
.tile:active { background: var(--ink-3); }
.tile svg { width: 24px; height: 24px; stroke: var(--red-text); fill: none; stroke-width: 1.8; }
.tile b { font: 800 19px/1 var(--display); text-transform: uppercase; }
.tile small { color: var(--mute); font-size: 12.5px; line-height: 1.35; }
.tile.wide { grid-column: 1 / -1; min-height: 0; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.tile .go { color: var(--mute); font-size: 18px; }
.tile .tag { position: absolute; top: 12px; right: 12px; font: 600 9.5px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--red-text); }
.row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); text-decoration: none; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; text-align: left; }
.row:last-child { border-bottom: 0; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 600; font-size: 15px; }
.row .t small { color: var(--mute); font-size: 12.5px; }
.row .go { color: var(--mute); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 700 14px/1 var(--body); padding: 14px 16px; border: 1px solid transparent; text-decoration: none; background: var(--ink-3); border-color: var(--line); }
.btn-red { background: var(--red); border-color: var(--red); color: #fff; }
.btn-ghost { background: transparent; }
.btn-sm { padding: 10px 12px; font-size: 13px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1 1 auto; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 8px 12px; background: transparent; border: 1px solid var(--line); font: 600 12.5px var(--body); color: var(--mute); }
.chip[aria-pressed="true"] { border-color: var(--bone); color: var(--bone); background: var(--ink-3); }
.mono { font-family: var(--mono); }
.muted { color: var(--mute); }
.note { color: var(--mute); font-size: 12px; margin-top: 10px; }

/* Market */
.mk { display: grid; gap: 10px; }
.mk-card { background: var(--ink-2); border: 1px solid var(--line); padding: 16px; }
.mk-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.mk-head h3 { font-size: 22px; font-weight: 800; }
.mk-per { font: 11px var(--mono); color: var(--mute); letter-spacing: .04em; }
.mk-total { font: 900 40px/1 var(--display); margin-top: 10px; }
.mk-total small { display: block; font: 12px var(--body); color: var(--mute); margin-top: 6px; }
.mk-bar { display: flex; height: 6px; margin: 14px 0 10px; gap: 2px; }
.mk-bar span { display: block; }
.mk-mix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mk-mix div { font-size: 12px; color: var(--mute); }
.mk-mix b { display: block; color: var(--bone); font: 700 15px var(--body); }
.mk-mix i { display: inline-block; width: 7px; height: 7px; margin-right: 5px; }
.mk-src { font-size: 11px; color: var(--mute); margin-top: 10px; }
.mk-src a { color: var(--mute); }
.tick { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
.tick::-webkit-scrollbar { display: none; }
.tick .mk-card { flex: 0 0 78%; }
.tick-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; margin-top: 12px; }
.tick-stats b { display: block; font: 700 17px var(--body); }
.tick-stats small { color: var(--mute); font-size: 11.5px; }
.up { color: var(--ok); } .down { color: var(--red-text); }
.fx { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); }
.fx div { padding: 12px; border-right: 1px solid var(--line); }
.fx div:last-child { border-right: 0; }
.fx span { font: 11px var(--mono); color: var(--mute); }
.fx b { display: block; font: 700 16px var(--body); }

/* Hero + launches */
.hero-cta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.lc { background: var(--ink-2); border: 1px solid var(--line); padding: 16px; display: grid; gap: 8px; text-align: left; width: 100%; }
.lc.pick { border-color: var(--red); }
.lc-top { display: flex; justify-content: space-between; gap: 8px; font: 600 10.5px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.lc-top .st { color: var(--red-text); text-align: right; }
.lc h3 { font-size: 26px; font-weight: 800; }
.lc .dev { color: var(--mute); font-size: 13px; }
.lc .pickbar { font: 700 10.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; background: var(--red); color: #fff; padding: 6px 8px; justify-self: start; }
.specs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 0; padding-top: 10px; border-top: 1px solid var(--line); }
.specs dt { font: 10.5px var(--mono); color: var(--mute); text-transform: uppercase; letter-spacing: .06em; }
.specs dd { margin: 2px 0 0; font-weight: 700; font-size: 14px; }
.lc-list { display: grid; gap: 10px; }

/* Overlay sheet */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--ink); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); visibility: hidden; }
.sheet.open { transform: none; visibility: visible; }
.sheet-bar { flex: none; height: calc(52px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 8px 0; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); background: var(--ink); }
.sheet-bar button { background: none; border: 0; width: 44px; height: 44px; display: grid; place-items: center; }
.sheet-bar svg { width: 22px; height: 22px; stroke: var(--bone); fill: none; stroke-width: 2; }
.sheet-bar h2 { font: 800 20px/1 var(--display); text-transform: uppercase; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-body { flex: 1; overflow: auto; position: relative; -webkit-overflow-scrolling: touch; }
.sheet-body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--ink); }
.native { padding: 18px 16px calc(32px + env(safe-area-inset-bottom, 0px)); max-width: 720px; margin: 0 auto; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ink); }
.bars { display: flex; gap: 4px; align-items: flex-end; height: 28px; }
.bars i { width: 5px; background: var(--red); animation: eq 0.9s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay: .15s } .bars i:nth-child(3) { animation-delay: .3s } .bars i:nth-child(4) { animation-delay: .45s }
@keyframes eq { 0%,100% { height: 25% } 50% { height: 100% } }
@media (prefers-reduced-motion: reduce) { .sheet { transition: none } .bars i { animation: none; height: 60% } }

/* Forms */
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.f { display: grid; gap: 6px; }
.f.full { grid-column: 1 / -1; }
.f label { font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.f input, .f select, .f textarea { width: 100%; background: var(--ink-3); border: 1px solid var(--line); padding: 12px; border-radius: 0; font-size: 16px; }
.f textarea { min-height: 120px; resize: vertical; line-height: 1.45; }
.f input:focus, .f select:focus, .f textarea:focus { outline: none; border-color: var(--bone); }
.seg { display: flex; border: 1px solid var(--line); }
.seg button { flex: 1; background: none; border: 0; padding: 11px 6px; font: 600 13px var(--body); color: var(--mute); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--bone); color: var(--ink); }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; background: var(--ink-3); border: 1px solid var(--line); }
.toggle input { width: 22px; height: 22px; accent-color: var(--red); }
.result { margin-top: 18px; background: var(--ink-2); border: 1px solid var(--line); }
.result .big { padding: 18px 16px; border-bottom: 1px solid var(--line); }
.result .big span { font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.result .big b { display: block; font: 900 42px/1.05 var(--display); margin-top: 6px; color: var(--bone); }
.result .big small { color: var(--mute); font-size: 12.5px; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t td { padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
table.t tr.tot td { font-weight: 800; border-bottom: 0; }
table.t tr.hl td { color: var(--red-text); }
.actions { padding: 14px 16px; display: flex; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); }
.actions .btn { flex: 1 1 140px; }

/* Lock */
.lock { text-align: center; padding: 40px 16px; display: grid; gap: 18px; justify-items: center; }
.dots { display: flex; gap: 14px; }
.dots i { width: 14px; height: 14px; border: 2px solid var(--mute); }
.dots i.on { background: var(--red); border-color: var(--red); }
.pad { display: grid; grid-template-columns: repeat(3, 76px); gap: 10px; }
.pad button { height: 64px; background: var(--ink-2); border: 1px solid var(--line); font: 700 26px var(--display); }
.pad button:active { background: var(--ink-3); }
.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-8px) } 40%,80% { transform: translateX(8px) } }

/* Leads */
.lead { background: var(--ink-2); border: 1px solid var(--line); padding: 14px; display: grid; gap: 8px; }
.lead.due { border-left: 3px solid var(--red); }
.lead-h { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.lead-h b { font-size: 16px; }
.stage { font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 7px; border: 1px solid var(--line); color: var(--mute); white-space: nowrap; }
.lead .meta { color: var(--mute); font-size: 13px; }
.lead .btn-row .btn { padding: 9px 10px; font-size: 12.5px; }
.empty { text-align: center; color: var(--mute); padding: 36px 16px; border: 1px dashed var(--line); }

/* Checklist */
.ck { display: grid; gap: 0; }
.ck label { display: grid; grid-template-columns: 24px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.ck input { width: 20px; height: 20px; accent-color: var(--red); margin: 2px 0 0; }
.ck b { font-weight: 600; }
.ck small { display: block; color: var(--mute); font-size: 12.5px; }
.ck input:checked + span b { color: var(--mute); text-decoration: line-through; }
.prog { height: 4px; background: var(--ink-3); margin: 8px 0 4px; }
.prog i { display: block; height: 100%; background: var(--red); }

.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 16px); transform: translateX(-50%); z-index: 60; background: var(--bone); color: var(--ink); padding: 10px 16px; font: 700 13px var(--body); max-width: calc(100% - 32px); }
.cred { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.cred div { background: var(--ink-2); padding: 12px; }
.cred span { font: 600 10.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mute); }
.cred b { display: block; font: 700 16px var(--body); margin-top: 3px; word-break: break-word; }
.qr { background: #fff; padding: 12px; justify-self: center; margin-top: 14px; }
.soc { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.soc a { background: var(--ink-2); border: 1px solid var(--line); padding: 12px 8px; text-align: center; text-decoration: none; font: 600 12.5px var(--body); }
.soc a small { display: block; color: var(--mute); font-size: 11px; font-weight: 500; }
.foot { color: var(--mute); font-size: 11.5px; text-align: center; margin: 28px 0 0; line-height: 1.6; }
@media (min-width: 560px) { .grid2 { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>

<header class="topbar">
  <a class="logo" href="#home" aria-label="AWaz Realty home">
    <svg viewBox="0 0 264 100" aria-hidden="true"><path fill="var(--red)" fill-rule="evenodd" d="M0,100 L18,0 L38,0 L56,100 L38,100 L34.5,80 L21.5,80 L18,100 Z M24.2,63 L28,36 L31.8,63 Z"/><g fill="currentColor"><path d="M62,0 L78,0 L85,58 L93,0 L111,0 L119,58 L126,0 L142,0 L129,100 L110,100 L102,44 L94,100 L75,100 Z"/><path fill-rule="evenodd" d="M148,100 L166,0 L186,0 L204,100 L186,100 L182.5,80 L169.5,80 L166,100 Z M172.2,63 L176,36 L179.8,63 Z"/><path d="M210,0 H264 V16 L231,84 H264 V100 H210 V84 L243,16 H210 Z"/></g></svg>

<main id="main"></main>

<nav class="tabs" aria-label="Sections">

  <button data-tab="guides"><svg viewBox="0 0 24 24"><path d="M4 5h6a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-6a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h6z"/></svg>Guides</button>

    <h2 id="sheetTitle"></h2>
    <button type="button" id="sheetShare" aria-label="Share" hidden><svg viewBox="0 0 24 24"><path d="M12 3v12M7 8l5-5 5 5M5 13v8h14v-8"/></svg></button>
  </div>

  </div>
</section>

<div class="toast" id="toast" hidden role="status"></div>

<script>
"use strict";
/* ============================================================

   Calculators and guides open the synced website (site.html) in app
   mode, so they always match the website. Data comes from data.js,
   regenerated from the website every morning.
   ============================================================ */

const WA = "971586032580", PHONE = "+971586032580", EMAIL = "ahusain@springfield-re.com";

function compact(n) {

  if (a >= 1e9) return s + f(a / 1e9, "bn"); if (a >= 1e6) return s + f(a / 1e6, "M"); if (a >= 1e3) return s + f(a / 1e3, "K"); return s + Math.round(a);
}
function inr(n) { if (n >= 1e7) { const c = n / 1e7; return "₹" + (c >= 100 ? Math.round(c).toLocaleString("en-IN") : c.toFixed(c >= 10 ? 1 : 2)) + " Cr"; } return "₹" + (n / 1e5).toFixed(1) + " L"; }

function bindBroker(root) {
  root.querySelector("#lockNow")?.addEventListener("click", () => { setBroker(false); go("home"); toast("Locked. Client mode on."); });

  pad.addEventListener("click", e => {

    const k = b.dataset.k;
    if (k === "⌫") pinBuf = pinBuf.slice(0, -1); else if (pinBuf.length < 4) pinBuf += k;
    if (pinBuf.length === 4) {
      if (pinStage === "enter") {
        if (hash(pinBuf) === S.get(PIN_KEY)) { pinBuf = ""; pinStage = ""; setBroker(true); toast("Broker mode on"); return; }
        return fail();
      }
      if (pinStage === "new") { pinStage = "confirm"; pinStage_new = pinBuf; pinBuf = ""; return render(); }
      if (pinStage === "confirm") {
        if (pinBuf === pinStage_new) { S.set(PIN_KEY, hash(pinBuf)); pinBuf = ""; pinStage = ""; setBroker(true); toast("PIN set. Broker mode on."); return; }
        pinStage = "new"; return fail("Didn't match. Try again.");
      }
    }

  });

const FEES = [

];
function quoteRows(o) {
  const f = FEES.find(x => x.id === o.fee) || FEES[0], price = o.price, loan = Math.min(price, o.loan), ready = o.state === "ready";
  const mreg = f.dubai ? loan * 0.0025 + 290 : f.abu ? Math.min(loan * 0.001, 1e6) : loan * 0.0025;
  const rows = [[`${f.auth} transfer fee (${f.pct}%)`, price * f.pct / 100]];
  if (f.dubai) rows.push(["DLD admin and title deed", 580]);
  if (f.dubai && ready) rows.push(["Registration trustee", price >= 500000 ? 4200 : 2100]);
  if (ready && o.agency) rows.push(["Agency fee (2% + VAT)", price * 0.021]);
  if (loan > 0) rows.push([`Mortgage registration${f.abu ? " (0.1%)" : " (0.25% + AED 290)"}`, mreg], ["Bank valuation (approx.)", 3150], ["Bank arrangement fee (up to 1% + VAT)", loan * 0.0105]);
  return { rows, fees: rows.reduce((a, r) => a + r[1], 0), loan, f };
}

/* ---------- converter ---------- */
function convertTool() {
  return {
    t: "Converter",
    html: () => `<div class="panel"><p class="eyebrow"><i></i>Size</p><div class="form" style="margin-top:10px">
        <div class="f"><label for="cv-ft">Sq ft</label><input id="cv-ft" type="number" inputmode="decimal" value="1000"></div>
        <div class="f"><label for="cv-m">Sq m</label><input id="cv-m" type="number" inputmode="decimal"></div></div></div>
      <div class="panel" style="margin-top:10px"><p class="eyebrow"><i></i>Price per foot</p><div class="form" style="margin-top:10px">
        <div class="f"><label for="cv-p">Price (AED)</label><input id="cv-p" type="number" inputmode="numeric" value="2000000"></div>
        <div class="f"><label for="cv-s">Size (sq ft)</label><input id="cv-s" type="number" inputmode="numeric" value="1000"></div>
        <div class="f"><label for="cv-r">Annual rent (AED)</label><input id="cv-r" type="number" inputmode="numeric" value="140000"></div>
        <div class="f"><label>Result</label><div id="cv-pr" style="padding:12px 0;font-weight:700"></div></div></div></div>
      <div class="panel" style="margin-top:10px"><p class="eyebrow"><i></i>Currency · rates of ${esc(fmtD((D.fx || {}).date, { day: "numeric", month: "short" }))}</p><div class="form" style="margin-top:10px">
        <div class="f full"><label for="cv-aed">AED</label><input id="cv-aed" type="number" inputmode="numeric" value="1000000"></div>
        <div class="f"><label for="cv-usd">USD</label><input id="cv-usd" type="number" inputmode="numeric"></div>
        <div class="f"><label for="cv-gbp">GBP</label><input id="cv-gbp" type="number" inputmode="numeric"></div>
        <div class="f full"><label for="cv-inr">INR</label><input id="cv-inr" type="number" inputmode="numeric"></div></div></div>`,
    init(nb) {
      const q = s => nb.querySelector(s), K = 10.7639;
      q("#cv-ft").addEventListener("input", () => q("#cv-m").value = (num(q("#cv-ft").value) / K).toFixed(1));
      q("#cv-m").addEventListener("input", () => q("#cv-ft").value = Math.round(num(q("#cv-m").value) * K));
      const pr = () => { const p = num(q("#cv-p").value), s = num(q("#cv-s").value), r = num(q("#cv-r").value); q("#cv-pr").innerHTML = `${s ? "AED " + Math.round(p / s).toLocaleString("en-US") + "/sq ft" : "—"}<br><span class="muted" style="font-weight:500">${p && r ? (r / p * 100).toFixed(2) + "% gross yield" : ""}</span>`; };
      ["#cv-p", "#cv-s", "#cv-r"].forEach(s => q(s).addEventListener("input", pr));
      const cs = { usd: "USD", gbp: "GBP", inr: "INR" };
      const fromAed = () => { const a = num(q("#cv-aed").value); for (const [k, c] of Object.entries(cs)) q("#cv-" + k).value = Math.round(a * FX[c]); };
      q("#cv-aed").addEventListener("input", fromAed);
      for (const [k, c] of Object.entries(cs)) q("#cv-" + k).addEventListener("input", () => { const a = num(q("#cv-" + k).value) / FX[c]; q("#cv-aed").value = Math.round(a); for (const [k2, c2] of Object.entries(cs)) if (k2 !== k) q("#cv-" + k2).value = Math.round(a * FX[c2]); });
      q("#cv-ft").dispatchEvent(new Event("input")); pr(); fromAed();
    }
  };
}

function settingsTool() {
  return {
    t: "Settings",
    html: () => `<div class="toggle"><label for="st-keep">Stay unlocked on this phone<br><small class="muted">Skip the PIN until you lock it yourself</small></label><input type="checkbox" id="st-keep"${S.get(KEEP, false) ? " checked" : ""}></div>

        <button class="row" id="st-csv"><div class="t"><b>Export leads (CSV)</b><small>Share to email or Drive, opens in Excel/Sheets</small></div><span class="go">↗</span></button>
        <button class="row" id="st-bak"><div class="t"><b>Back up everything</b><small>Leads, templates, checklists as one text block</small></div><span class="go">↗</span></button>
        <button class="row" id="st-res"><div class="t"><b>Restore from backup</b><small>Paste a backup to bring your data to a new phone</small></div><span class="go">→</span></button>
      </div>
      <div class="f full" id="st-resbox" hidden style="margin-top:12px"><label for="st-paste">Paste backup</label><textarea id="st-paste"></textarea><button class="btn btn-red" id="st-do" style="margin-top:8px">Restore</button></div>
      <p class="foot">App data synced ${esc(D.synced || "—")} · website version ${esc(SITE_V || "—")}</p>`,
    init(nb) {
      const q = s => nb.querySelector(s);
      q("#st-keep").addEventListener("change", e => { S.set(KEEP, e.target.checked); S.set("awaz-keep-on", e.target.checked); toast(e.target.checked ? "Stays unlocked" : "PIN each time"); });
      q("#st-pin").addEventListener("click", () => { S.set(PIN_KEY, null); try { localStorage.removeItem(PIN_KEY); } catch (e) {} S.sset(UNLOCK, null); S.set("awaz-keep-on", false); pinStage = "new"; closeSheet(); go("broker"); });
      q("#st-csv").addEventListener("click", () => {
        const L = S.get("awaz-leads", []), cols = ["name", "phone", "stage", "next", "interest", "budget", "source", "notes", "created", "updated"];
        const csv = [cols.join(",")].concat(L.map(l => cols.map(c => `"${String(l[c] || "").replace(/"/g, '""')}"`).join(","))).join("\n");
        if (NB && NB.saveFile) NB.saveFile("awaz-leads-" + today() + ".csv", csv, "text/csv"); else shareText(csv, "AWaz leads");
      });
      q("#st-bak").addEventListener("click", () => {
        const o = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("awaz-") && k !== PIN_KEY) o[k] = localStorage.getItem(k); } } catch (e) {}
        const t = "AWAZ-BACKUP " + btoa(unescape(encodeURIComponent(JSON.stringify(o))));
        if (NB && NB.saveFile) NB.saveFile("awaz-backup-" + today() + ".txt", t, "text/plain"); else shareText(t, "AWaz backup");
      });
      q("#st-res").addEventListener("click", () => q("#st-resbox").hidden = false);
      q("#st-do").addEventListener("click", () => {
        try { const o = JSON.parse(decodeURIComponent(escape(atob(q("#st-paste").value.trim().replace(/^AWAZ-BACKUP\s+/, ""))))); for (const [k, v] of Object.entries(o)) if (k.startsWith("awaz-")) localStorage.setItem(k, v); toast("Restored"); paintMode(); }
        catch (e) { toast("That doesn't look like a backup"); }
      });
    }
  };
}
